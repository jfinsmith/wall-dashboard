name: Build & deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"   # refresh news every 30 minutes
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Start from the last published news (fallback if Ground News is unreachable)
        run: curl -fsSL "https://jfinsmith.github.io/wall-dashboard/news.json" -o news.json || echo '{"generated":null,"sections":[]}' > news.json
      - name: Fetch Ground News
        run: python3 scripts/fetch_news.py news.json || echo "::warning::news fetch failed, keeping previous news.json"
      - name: Stamp app version (dashboard reloads itself when this changes)
        run: echo "{\"v\":\"${GITHUB_SHA}\"}" > version.json
      - name: Keep the schedule alive (GitHub pauses schedules after 60 idle days)
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive" && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
